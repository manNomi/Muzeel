name: 실험 결과
description: 재현 가능한 실험 실행과 실패를 기록합니다.
title: "[Experiment] "
labels:
  - experiment
body:
  - type: input
    id: commit
    attributes:
      label: Muzeel 커밋
      placeholder: Git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제와 Python과 Node.js와 Chrome 및 대상 범위를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 재현 명령
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 결과
      description: 성공과 실패를 포함해 상태와 청크와 함수 및 회귀 지표를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: 공개 가능한 결과 파일
      description: 저장소 안의 익명화된 JSON 또는 Markdown 경로를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 주장 범위
      description: 이 결과로 말할 수 있는 내용과 말할 수 없는 내용을 구분해 주세요.
    validations:
      required: true
